{% load static %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/src/style.css" rel="stylesheet">
{% endblock %}

{% block content %}
<body class="d-flex flex-column min-vh-100 bg-light">

  <main class="flex-fill d-flex justify-content-center align-items-center">
    <form method="post" class="form-signin text-center bg-white p-4 rounded shadow-sm">
      {% csrf_token %}

      <img class="mb-4 rounded-circle" src="{% static 'images/Logo_PCF.png' %}" alt="Logo" width="72" height="72">
      <h1 class="h3 mb-3 fw-normal">Entrar</h1>

      {% if form.errors %}
        <div class="alert alert-danger py-2">
          Usuário ou senha inválidos.
        </div>
      {% endif %}

      <div class="form-floating mb-2">
        <input type="text" name="username" class="form-control" id="floatingUser" placeholder="Usuário" required>
        <label for="floatingUser">Usuário</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Senha" required>
        <label for="floatingPassword">Senha</label>
      </div>

      <div class="form-check text-start mb-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe">
        <label class="form-check-label" for="rememberMe">
          Lembrar de mim
        </label>
      </div>

      <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>
      <p class="mt-5 mb-3 text-body-secondary">&copy; {% now "Y" %}</p>
    </form>
  </main>

  {% include 'footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
{% endblock %}
