{% block footer %}
{% if user.is_authenticated %}
{% load static %}
<div style="background:hsl(var(--background));margin-top:1.5rem">
  <div class="pcf-container" style="padding-block:1.5rem">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem">

      <a href="{% url 'inicio' %}" style="display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink)">
        <img src="{% static 'images/Logo_PCF.png' %}" alt="" style="width:26px;height:26px;border-radius:8px">
        <span style="font-weight:750;font-size:.88rem;letter-spacing:-.01em">Projeto Criança Feliz</span>
      </a>

      <nav style="display:flex;flex-wrap:wrap;gap:.15rem">
        <a href="{% url 'inicio' %}" class="pcf-btn pcf-btn-ghost pcf-btn-sm">Início</a>
        <a href="{% url 'atendido:atendido_view' %}" class="pcf-btn pcf-btn-ghost pcf-btn-sm">Atendidos</a>
        <a href="{% url 'voluntario:voluntario_view' %}" class="pcf-btn pcf-btn-ghost pcf-btn-sm">Voluntários</a>
        <a href="{% url 'semanario:semanario_view' %}" class="pcf-btn pcf-btn-ghost pcf-btn-sm">Semanários</a>
        <a href="{% url 'supply:painel_materiais' %}" class="pcf-btn pcf-btn-ghost pcf-btn-sm">Supply</a>
      </nav>

      <a href="https://www.instagram.com/criancafelizprojeto/" target="_blank" rel="noopener"
         class="pcf-iconbtn" style="margin-left:auto" title="Instagram" aria-label="Instagram">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect width="20" height="20" x="2" y="2" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
      </a>
    </div>

    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;
                margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid hsl(var(--border))">
      <p style="margin:0;font-size:.76rem;color:hsl(var(--muted-foreground))">
        &copy; <span id="footer-year"></span> Projeto Criança Feliz
      </p>
      <p style="margin:0;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.74rem;color:hsl(var(--muted-foreground))">
        <span>Desenvolvido por</span>
        <a href="https://www.linkedin.com/in/caio-marciano/" target="_blank" rel="noopener" style="color:var(--ink-soft);font-weight:600">Caio Marciano</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.linkedin.com/in/frois/" target="_blank" rel="noopener" style="color:var(--ink-soft);font-weight:600">Matheus Frois</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.linkedin.com/in/vin%C3%ADcius-bas%C3%ADlio/" target="_blank" rel="noopener" style="color:var(--ink-soft);font-weight:600">Vinícius Basílio</a>
      </p>
    </div>
  </div>
  <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
</div>
{% endif %}
{% endblock %}
