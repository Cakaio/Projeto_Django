{% block footer %}
<footer style="background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%); color: white; margin-top: 3rem;">
  <div class="container py-5">
    <div class="row">
      <!-- Coluna Principal -->
      <div class="col-md-4 mb-4">
        <h5 style="font-weight: 700; font-size: 1.4rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
          Projeto Criança Feliz
        </h5>
        <p style="opacity: 0.9; line-height: 1.7; font-size: 0.95rem;">
          Transformando vidas por meio da empatia, criatividade e respeito.
        </p>
      </div>

      <!-- Links Úteis -->

        <h6 style="font-weight: 600; font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid rgba(255,255,255,0.3); display: inline-block;">

        </h6>
        <ul class="list-unstyled" style="margin-top: 0.5rem;">

            <a href="#" class="footer-link" style="color: white; text-decoration: none; opacity: 0.85; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              Início
            </a>
          </li>
          <li style="margin-bottom: 0.6rem;">
            <a href="#" class="footer-link" style="color: white; text-decoration: none; opacity: 0.85; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              Atendidos
            </a>
          </li>
          <li style="margin-bottom: 0.6rem;">
            <a href="#" class="footer-link" style="color: white; text-decoration: none; opacity: 0.85; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              </svg>
              Contato
            </a>
          </li>
        </ul>
      </div>

      <!-- Redes Sociais -->
      <div class="col-md-4 mb-4">
        <h6 style="font-weight: 600; font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid rgba(255,255,255,0.3); display: inline-block;">

        </h6>
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">

          <a href="#" class="social-link" style="color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem; background: rgba(255,255,255,0.1); border-radius: 2rem; width: fit-content; transition: all 0.2s ease;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>

            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Barra Inferior -->
  <div style="background: rgba(0,0,0,0.2); text-align: center; padding: 1rem 0;">
    <small style="opacity: 0.9;">&copy; 2025 Projeto Criança Feliz — Todos os direitos reservados.</small>
  </div>

  <!-- Estilos de Hover -->
  <style>
    .footer-link:hover {
      opacity: 1 !important;
      transform: translateX(4px);
    }
    .social-link:hover {
      background: rgba(255,255,255,0.2) !important;
      transform: translateY(-2px);
    }
  </style>
</footer>
