<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/src/style.css" rel="stylesheet">

    {% block head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100 font-primary">
    {% include 'navbar.html' %}
    <main class="flex-fill">{% block content %}{% endblock %}</main>
    <footer class="mt-auto">{% include 'footer.html' %}</footer>

    <!-- Bootstrap JS (necessário pro dropdown e navbar-toggler funcionarem) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
