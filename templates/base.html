<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/src/style.css" rel="stylesheet">

    <style>
      body {
        padding-top: 70px; /* Evita que o conteúdo fique escondido pela navbar */
      }
    </style>

    {% block head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100 font-primary">
    {% include 'navbar.html' %}
    
    {% if messages %}
      <div class="container mt-3">
        {% for message in messages %}
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <main class="flex-fill">{% block content %}{% endblock %}</main>
    <footer class="mt-auto">{% include 'footer.html' %}</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
