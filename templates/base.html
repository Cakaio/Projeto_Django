<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/src/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,  /* desabilita reset para não conflitar com Bootstrap */
        },
        theme: {
          extend: {
            colors: {
              border:      'hsl(var(--border))',
              input:       'hsl(var(--input))',
              ring:        'hsl(var(--ring))',
              background:  'hsl(var(--background))',
              foreground:  'hsl(var(--foreground))',
              primary: {
                DEFAULT:    'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT:    'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              destructive: {
                DEFAULT:    'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              muted: {
                DEFAULT:    'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT:    'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              card: {
                DEFAULT:    'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            borderRadius: {
              lg:  'var(--radius)',
              md:  'calc(var(--radius) - 2px)',
              sm:  'calc(var(--radius) - 4px)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <!-- shadcn/ui CSS variables (light mode) -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

      :root {
        --background:          0 0% 100%;
        --foreground:          240 10% 3.9%;
        --card:                0 0% 100%;
        --card-foreground:     240 10% 3.9%;
        --popover:             0 0% 100%;
        --popover-foreground:  240 10% 3.9%;
        --primary:             240 5.9% 10%;
        --primary-foreground:  0 0% 98%;
        --secondary:           240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted:               240 4.8% 95.9%;
        --muted-foreground:    240 3.8% 46.1%;
        --accent:              240 4.8% 95.9%;
        --accent-foreground:   240 5.9% 10%;
        --destructive:         0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border:              240 5.9% 90%;
        --input:               240 5.9% 90%;
        --ring:                240 5.9% 10%;
        --radius:              0.5rem;
      }

      body {
        padding-top: 56px;
        font-family: 'Inter', system-ui, sans-serif;
      }
    </style>

    {% block head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100 font-primary">
    {% include 'navbar.html' %}
    
    {% if messages %}
      <div class="container mt-3">
        {% for message in messages %}
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <main class="flex-fill">{% block content %}{% endblock %}</main>
    <footer class="mt-auto">{% include 'footer.html' %}</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
