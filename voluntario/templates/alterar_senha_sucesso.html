{% extends "base.html" %}

{% block titulo %}Senha Alterada{% endblock %}

{% block content %}
<div style="background:hsl(var(--background)); min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div class="pcf-container" style="padding-top:3rem; padding-bottom:3rem; max-width:480px;">
    <div class="pcf-card text-center" style="padding:2.5rem 1.75rem;">

      <div class="pcf-icon-tile tint-green" style="width:64px; height:64px; border-radius:20px; margin:0 auto 1.25rem;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>

      <h1 style="font-weight:800; letter-spacing:-.02em; color:var(--ink); font-size:1.5rem; line-height:1.1;">
        Senha alterada com sucesso!
      </h1>
      <p class="pcf-lead" style="margin-top:.6rem;">
        Sua senha foi atualizada com segurança.<br>Use sua nova senha para acessar o sistema.
      </p>

      <a href="{% url 'voluntario:meu_perfil' %}" class="pcf-btn pcf-btn-primary pcf-btn-lg mt-6">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Voltar ao Meu Perfil
      </a>
    </div>
  </div>
</div>
{% endblock %}
