{% extends 'base.html' %}
{% block titulo %}Reembolso Enviado{% endblock %}

{% block content %}
<div class="pcf-container rms-wrap">
  <div class="pcf-card rms-card">
    <span class="rms-icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    </span>

    <span class="pcf-badge ok rms-badge">Pedido recebido</span>
    <h1 class="rms-title">Pedido enviado!</h1>
    <p class="rms-sub">Seu pedido de reembolso foi recebido pelo <strong>ADM/FIN</strong>. O time foi notificado e analisará sua solicitação em breve.</p>

    <div class="rms-actions">
      <a href="{% url 'inicio' %}" class="pcf-btn pcf-btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Voltar ao Início
      </a>
    </div>
  </div>
</div>

<style>
  .rms-wrap { max-width: 520px; padding-top: clamp(2.5rem, 8vw, 5rem); padding-bottom: clamp(3rem, 8vw, 5rem); }
  .rms-card { text-align: center; padding: clamp(1.75rem, 6vw, 2.75rem); }
  .rms-icon { display: inline-flex; align-items: center; justify-content: center; width: 76px; height: 76px; margin-bottom: 1.1rem; border-radius: 22px; background: #eaf7ef; color: #1f7a49; }
  .rms-badge { margin-bottom: .85rem; }
  .rms-title { margin: 0 0 .6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-size: clamp(1.5rem, 4vw, 2rem); color: var(--ink); }
  .rms-sub { margin: 0 auto 1.75rem; max-width: 42ch; font-size: .95rem; line-height: 1.6; color: hsl(var(--muted-foreground)); }
  .rms-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }

  @media (max-width: 480px) {
    .rms-actions { flex-direction: column; }
    .rms-actions .pcf-btn { width: 100%; }
  }
</style>
{% endblock %}
